{% extends "base.html" %}
{% block content %}
<h2>Alice's Wallet</h2>

<div class="card">
    <h3>Current State</h3>
    <p><strong>Serial Number:</strong> {{ node.serial_number or 'None' }}</p>
    <p><strong>Shared Secret:</strong> {{ node.shared_secret or 'None' }}</p>
</div>

<div class="card">
    <h3>Request Token from Bank</h3>
    <form action="{{ url_for('alice_request') }}" method="POST">
        <button type="submit">Request Token</button>
    </form>
</div>

{% if node.serial_number %}
<div class="card">
    <h3>Send to Charlie</h3>
    <form action="{{ url_for('alice_send') }}" method="POST">
        <div class="form-group">
            <label for="ttl">TTL (minutes)</label>
            <input type="number" id="ttl" name="ttl" value="5" step="0.1" required>
        </div>
        <div class="form-group">
            <label for="target_geohash">Target Geohash</label>
            <input type="text" id="target_geohash" name="target_geohash" value="u4pruydqqvj" required>
        </div>
        <button type="submit">Send to Charlie</button>
    </form>
</div>
{% endif %}

{% endblock %}
